[project]
name = "workbench"
version = "0.1.0"
description = "One click-around UI over fts and portfolio_analyser (W3)"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "pandas",
    "fts",
    "portfolio-analyser",
    "quant-ui",
]

[project.scripts]
workbench = "workbench.cli:main"

[tool.uv.sources]
fts = { workspace = true }
portfolio-analyser = { workspace = true }
quant-ui = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
