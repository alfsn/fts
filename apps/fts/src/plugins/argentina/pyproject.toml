[project]
name = "fts-plugin-argentina"
version = "0.1.0"
description = "Argentina Market Plugin for FTS - BYMA, Rofex, and CCL"
authors = [
    { name = "Alfredo Sampron", email = "alfredosampronnoel@gmail.com" },
]
dependencies = [
    "fts",
]
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.uv.sources]
fts = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"argentina" = "."}
packages = ["argentina"]
