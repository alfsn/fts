[project]
name = "fts-plugin-nets"
version = "0.1.0"
description = "Nets Plugin for FTS - Forecasting & ML"
authors = [
    { name = "Alfredo Sampron", email = "alfredosampronnoel@gmail.com" },
]
dependencies = [
    "fts",
    "onnxruntime",
    "numpy",
    "xgboost",
    "scikit-learn",
    "torch",
    "onnxmltools",
    "skl2onnx",
    "onnx",
    "tensorboard",
    "onnxscript",
    "optuna",
]
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.uv.sources]
fts = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"nets" = "."}
packages = ["nets"]
