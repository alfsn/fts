# LSTM Hyperparameter Search Configuration File
study_name: "lstm_btc_optimization"
direction: "minimize"  # Minimize validation loss
n_trials: 10
model_type: "lstm"
market_id: "BTC/USDT"
interval: "30m"
start_date: "2025-11-04T19:30:00+00:00"
end_date: "2026-05-30T19:30:00+00:00"

# Preprocessing & Feature parameters
lookback_period: 20
feature_cols: ["open", "high", "low", "close", "volume"]
feature_pipeline:
  class_path: "trading_bot.core.transforms.FeaturePipeline"
  params:
    transforms:
      - class_path: "trading_bot.core.transforms.LogReturnTransform"
        params:
          col_idx: 3
      - class_path: "trading_bot.core.transforms.RatioTransform"
        params:
          num_idx: 1
          den_idx: 3
      - class_path: "trading_bot.core.transforms.RatioTransform"
        params:
          num_idx: 2
          den_idx: 3
      - class_path: "trading_bot.core.transforms.RatioTransform"
        params:
          num_idx: 0
          den_idx: 3
      - class_path: "trading_bot.core.transforms.LogReturnTransform"
        params:
          col_idx: 4

# Search Space Definitions
search_space:
  learning_rate:
    type: "float"
    low: 0.0001
    high: 0.01
    log: true
  hidden_dim:
    type: "int"
    low: 16
    high: 64
  epochs:
    type: "int"
    low: 10
    high: 10
  batch_size:
    type: "int"
    low: 32
    high: 32
  num_layers:
    type: "int"
    low: 1
    high: 1
  dropout:
    type: "float"
    low: 0.1
    high: 0.1
  bidirectional:
    type: "categorical"
    choices: [false]
  optimizer:
    type: "categorical"
    choices: ["adam"]
  loss_fn:
    type: "categorical"
    choices: ["mse"]
