# RNN Hyperparameter Search Configuration File
study_name: "rnn_btc_optimization"
direction: "minimize"  # Minimize validation loss
n_trials: 10
model_type: "rnn"
market_id: "BTC/USDT"
interval: "30m"

# Preprocessing & Feature parameters
lookback_period: 20
feature_cols: ["close"]

# Search Space Definitions
search_space:
  learning_rate:
    type: "float"
    low: 0.0001
    high: 0.01
    log: true
  hidden_dim:
    type: "int"
    low: 16
    high: 64
  epochs:
    type: "int"
    low: 10
    high: 10
  batch_size:
    type: "int"
    low: 32
    high: 32
  num_layers:
    type: "int"
    low: 1
    high: 1
  dropout:
    type: "float"
    low: 0.1
    high: 0.1
  nonlinearity:
    type: "categorical"
    choices: ["tanh"]
  optimizer:
    type: "categorical"
    choices: ["adam"]
  loss_fn:
    type: "categorical"
    choices: ["mse"]
