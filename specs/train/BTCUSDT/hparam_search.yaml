# Hyperparameter Search Configuration File
imports:
  - "specs/components/markets/btc_usdt_30m.yaml"
  - "specs/components/features/close_only.yaml"

study:
  study_name: "lstm_btc_optimization"
  direction: "minimize"
  n_trials: 10
  model_type: "lstm"

# Search Space Definitions
search_space:
  learning_rate:
    type: "float"
    low: 0.0001
    high: 0.01
    log: true
  hidden_dim:
    type: "int"
    low: 16
    high: 64
  num_layers:
    type: "int"
    low: 1
    high: 3
  dropout:
    type: "float"
    low: 0.0
    high: 0.5
  optimizer:
    type: "categorical"
    choices: ["adam", "rmsprop"]
  epochs:
    type: "int"
    low: 5
    high: 15
