# Hyperparameter Search Configuration File
study_name: "lstm_btc_optimization"
direction: "minimize"  # Minimize validation loss
n_trials: 10
model_type: "lstm"
market_id: "BTC/USDT"
interval: "30m"

# Preprocessing & Feature parameters
lookback_period: 20
feature_cols: ["close"]

# Search Space Definitions
search_space:
  learning_rate:
    type: "float"
    low: 0.0001
    high: 0.01
    log: true
  hidden_dim:
    type: "int"
    low: 16
    high: 64
  num_layers:
    type: "int"
    low: 1
    high: 3
  dropout:
    type: "float"
    low: 0.0
    high: 0.5
  optimizer:
    type: "categorical"
    choices: ["adam", "rmsprop"]
  epochs:
    type: "int"
    low: 5
    high: 15
