[project]
name = "fts"
version = "0.1.0"
description = "An automated trading system for Polymarket or Kalshi"
authors = [
    { name = "Alfredo Sampron", email = "alfredosampronnoel@gmail.com" },
]
dependencies = [
    "pre-commit>=4.3.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.44",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
# Dependencies only needed for development, testing, and linting
dev = [
    "pytest>=7.0",
    "pre-commit",
    "black",
    "pycln",
    "isort",
    "flake8",
    "mypy", # Static type checker
]

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.uv]
