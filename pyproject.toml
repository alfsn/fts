[project]
name = "fts-workspace"
version = "0.1.0"
description = "Workspace for the fts trading system"
authors = [
    { name = "Alfredo Sampron", email = "alfredosampronnoel@gmail.com" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pre-commit>=4.3.0",
    "pandas",
    "plotly",
    "streamlit",
    "ipywidgets",
    "anywidget",
    "nbformat",
    "ipykernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit",
    "black",
    "pycln",
    "isort",
    "flake8",
    "mypy",
]

[tool.uv.workspace]
members = [
    "apps/fts/src/trading_bot",
    "apps/fts/src/plugins/nets",
    "apps/fts/src/plugins/argentina",
    "apps/fts/src/plugins/yfinance",
    "apps/fts/src/plugins/ccxt",
    "apps/portfolio_analyser",
    "packages/*"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"

[tool.uv]
