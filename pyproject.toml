[project]
name = "fts-workspace"
version = "0.1.0"
description = "Workspace for the fts trading system"
authors = [
    { name = "Alfredo Sampron", email = "alfredosampronnoel@gmail.com" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pre-commit>=4.3.0",
    "pandas",
    "plotly",
    "ipywidgets",
    "anywidget",
    "nbformat",
    "ipykernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit",
    "black",
    "pycln",
    "isort",
    "flake8",
    "mypy",
    "import-linter",
]

# Architecture guards: `uv run lint-imports` (CI runs it). Each plan PR adds the
# contract for the boundary it creates (docs/plans/modularization.md).
[tool.importlinter]
root_packages = [
    "quant_core",
    "quant_data",
    "quant_ui",
    "portfolio_analyser",
    "trading_bot",
    "nets",
    "argentina",
    "workbench",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Shared packages never import an app"
type = "forbidden"
source_modules = ["quant_core", "quant_data", "quant_ui"]
forbidden_modules = [
    "trading_bot",
    "plugins",
    "nets",
    "argentina",
    "portfolio_analyser",
]

[[tool.importlinter.contracts]]
name = "The analyser never imports fts"
type = "forbidden"
source_modules = ["portfolio_analyser"]
forbidden_modules = ["trading_bot", "nets", "argentina"]

[[tool.importlinter.contracts]]
name = "fts never imports the analyser"
type = "forbidden"
source_modules = ["trading_bot", "nets", "argentina"]
forbidden_modules = ["portfolio_analyser"]

[[tool.importlinter.contracts]]
name = "The analyser CLI reaches the pipeline only through review"
type = "forbidden"
source_modules = ["portfolio_analyser.main"]
forbidden_modules = ["portfolio_analyser.data_layer"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only trading_bot.runs knows the run tables (M1)"
type = "forbidden"
source_modules = [
    "trading_bot.__main__",
    "trading_bot.backtesting",
    "trading_bot.config",
    "trading_bot.core",
    "trading_bot.data_ingestion",
    "trading_bot.execution",
    "trading_bot.monitoring",
    "trading_bot.risk_management",
    "trading_bot.strategy",
    "trading_bot.utils",
    "nets",
    "argentina",
]
forbidden_modules = ["trading_bot.runs.tables"]
# Callers reach the tables through RunRecorder / RunStore by design.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "fts reads the price cache only through quant_data's repository (M2a)"
type = "forbidden"
source_modules = ["trading_bot", "nets", "argentina"]
forbidden_modules = ["quant_data.db.models"]
# quant_data.db's __init__ imports its models; fts uses the repository, cache_url and init_cache.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "streamlit only in the workbench (W3a)"
type = "forbidden"
source_modules = [
    "quant_core",
    "quant_data",
    "quant_ui",
    "portfolio_analyser",
    "trading_bot",
    "nets",
    "argentina",
]
forbidden_modules = ["streamlit"]

[[tool.importlinter.contracts]]
name = "The workbench never calculates or opens data: it calls use cases (W3a)"
type = "forbidden"
source_modules = ["workbench"]
forbidden_modules = [
    "quant_core.analytics",
    "quant_core.metrics",
    "quant_data.db",
    "quant_data.providers",
    "quant_data.history",
    "sqlalchemy",
    "portfolio_analyser.data_layer",
    "portfolio_analyser.main",
    "trading_bot.runs",
    "trading_bot.backtesting",
    "nets",
    "argentina",
]
# The use cases themselves reach these; the rule is about the workbench's own imports.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The cache inspector only reads: it never reaches a vendor (W3b)"
type = "forbidden"
source_modules = ["quant_data.inspect"]
forbidden_modules = ["quant_data.providers", "yfinance", "ccxt"]

[[tool.importlinter.contracts]]
name = "quant_core imports no other workspace package"
type = "forbidden"
source_modules = ["quant_core"]
forbidden_modules = ["quant_data", "quant_ui"]

[[tool.importlinter.contracts]]
name = "quant_data builds on quant_core only"
type = "forbidden"
source_modules = ["quant_data"]
forbidden_modules = ["quant_ui"]

[[tool.importlinter.contracts]]
name = "quant_ui draws only: no data access"
type = "forbidden"
source_modules = ["quant_ui"]
forbidden_modules = ["quant_data", "sqlalchemy", "yfinance", "ccxt"]

[tool.uv.workspace]
members = [
    "apps/fts/src/trading_bot",
    "apps/fts/src/plugins/nets",
    "apps/fts/src/plugins/argentina",
    "apps/fts/src/plugins/yfinance",
    "apps/fts/src/plugins/ccxt",
    "apps/portfolio_analyser",
    "apps/workbench",
    "packages/*"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"

[tool.uv]
