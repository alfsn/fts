[project]
name = "quant-data"
version = "0.1.0"
description = "Infrastructure and Data Layer for Quant Workspace"
dependencies = [
    "quant-core",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "yfinance>=0.2.35",
    "tenacity>=8.2.3"
]
requires-python = ">=3.12"

[tool.uv.sources]
quant-core = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"quant_data" = "src/quant_data"}
packages = ["quant_data"]
