name: "nets_cnn_backtest"
market_ids: ["BTC/USDT"]

loop_driver:
  class_path: "trading_bot.core.loop.HistoricalReplayLoop"
  params:
    save_backtest_report: true
    backtest_report_dir: "runs/reports"
    data_reader:
      class_path: "trading_bot.backtesting.readers.CSVBacktestDataReader"
      params:
        file_path: "data/market_data/btc_usdt_historical.csv"
        market_id: "BTC/USDT"

market_provider:
  class_path: "yfinance_plugin.data_providers.YFinanceMarketDataProvider"
  params:
    period: "30d"
    interval: "1h"

strategies:
  - class_path: "nets.strategies.nets_strategy.NetsStrategy"
    params:
      lookback_period: 20
      name_suffix: "cnn"
      predictor:
        class_path: "nets.inference.ONNXPredictor"
        params:
          model_path: "models/my_rnn_model.onnx"
      transform:
        class_path: "trading_bot.core.transforms.LogReturnTransform"
      output_selector:
        class_path: "nets.output_selectors.QuantileOutputSelector"
        params:
          threshold: 0.001
          spread_scale: 1.5

sizing_strategy:
  class_path: "trading_bot.risk_management.sizing.fixed_amount.FixedAmountSizer"
  params:
    default_amount_quote: 1000.0

execution_handler:
  class_path: "trading_bot.execution.handlers.polymarket_handler.PolymarketHandler"

extra_models: []
